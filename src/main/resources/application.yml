spring:
  ai:
    openai:
      # Placeholder satisfies Spring AI 1.0.7's hasText() assertion when
      # OPENAI_API_KEY is unset. Stub-mode detection in SpringAiConfig
      # reads OPENAI_API_KEY directly (not this property) so the placeholder
      # is invisible to our application logic. The auto-configured ChatClient
      # is only invoked from SpringAiOpenAiClient, which is only wired when
      # the real env var is set.
      api-key: ${OPENAI_API_KEY:stub-mode-no-real-calls}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
          # All chat options live HERE only. Do not duplicate in
          # ChatClient.Builder.defaultOptions() or per-call .options() —
          # Spring AI precedence is per-call > builder > yml, so duplicates
          # silently override. Single source of truth = this yml block.
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.format_sql: true
  datasource:
    url: jdbc:h2:mem:tasks;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
logging:
  level:
    com.eulerity.taskmanager.ai: DEBUG
